<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewsX_Tra - Latest News</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f5f7;color:#111}
header{background:#111;color:white;position:sticky;top:0;z-index:10}
.top{max-width:1100px;margin:auto;padding:15px;display:flex;
justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}
.logo span{color:#ffd400}
.tag{font-size:12px;color:#ccc;margin-top:3px}
nav{max-width:1100px;margin:auto;display:flex;gap:7px;
overflow:auto;padding:0 15px 12px}
nav button{border:0;border-radius:20px;padding:9px 15px;
background:#222;color:white;white-space:nowrap}
nav button:hover,nav button.active{background:#ffd400;color:#111}
.container{max-width:1100px;margin:20px auto;padding:0 15px}
.breaking{background:white;border-left:5px solid red;padding:13px;
border-radius:7px;margin-bottom:18px}
.breaking b{color:red;margin-right:8px}
.search{width:100%;padding:13px;border:1px solid #ddd;
border-radius:8px;margin-bottom:18px;font-size:15px}
h1{margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:white;border-radius:10px;overflow:hidden;
box-shadow:0 2px 8px #0001}
.card img{width:100%;height:190px;object-fit:cover}
.cardbody{padding:14px}
.cat{font-size:12px;color:red;font-weight:bold;margin-bottom:7px}
.card h2{font-size:18px;line-height:1.4}
.date{font-size:12px;color:#777;margin-top:7px}
.read{margin-top:12px;padding:9px 12px;background:#111;color:white;
border:0;border-radius:6px}
footer{margin-top:35px;background:#111;color:#bbb;text-align:center;
padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0009;
z-index:20;padding:20px;overflow:auto}
.article{background:white;max-width:800px;margin:30px auto;
padding:22px;border-radius:10px;position:relative}
.close{position:absolute;right:12px;top:10px;border:0;
border-radius:50%;font-size:22px;width:35px;height:35px}
.article img{width:100%;margin:15px 0;border-radius:8px}
.article p{font-size:17px;line-height:1.8}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.logo{font-size:23px}}
</style>
</head>

<body>

<header>
<div class="top">
<div>
<div class="logo">NewsX<span>_Tra</span></div>
<div class="tag">सच • तथ्य • भरोसा</div>
</div>
<div>Latest News</div>
</div>

<nav id="menu"></nav>
</header>

<main class="container">

<div class="breaking">
<b>BREAKING</b>
<span>NewsX_Tra पर देश-दुनिया की ताज़ा खबरें</span>
</div>

<input class="search" id="search" placeholder="🔎 खबर खोजें...">

<h1 id="heading">ताज़ा खबरें</h1>

<section class="grid" id="newsGrid"></section>

</main>

<footer>
<strong>NewsX_Tra</strong><br>
सच • तथ्य • भरोसा<br><br>
© 2026 NewsX_Tra. All Rights Reserved.
</footer>

<div class="modal" id="modal">
<div class="article">
<button class="close" onclick="closeArticle()">×</button>
<div id="articleContent"></div>
</div>
</div>

<script>

const news=[

{
id:1,
cat:"भारत",
title:"देश-दुनिया की बड़ी खबरों के लिए NewsX_Tra से जुड़े रहें",
text:"यह NewsX_Tra की डेमो खबर है। वास्तविक खबर प्रकाशित करते समय शीर्षक, फोटो और पूरी सत्यापित जानकारी यहाँ डालें।",
img:"https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1200&q=80",
date:"1 अक्टूबर 2026"
},

{
id:2,
cat:"राजनीति",
title:"राजनीति से जुड़ी ताज़ा खबरें और महत्वपूर्ण अपडेट",
text:"यह डेमो खबर है। राजनीतिक खबर प्रकाशित करने से पहले विश्वसनीय स्रोत से तथ्य सत्यापित करें।",
img:"https://images.unsplash.com/photo-1529107386315-e1a2ed48a620?auto=format&fit=crop&w=1200&q=80",
date:"1 अक्टूबर 2026"
},

{
id:3,
cat:"राजस्थान",
title:"राजस्थान की प्रमुख खबरें एक जगह",
text:"NewsX_Tra पर राजस्थान की प्रमुख खबरों के अपडेट पढ़ें।",
img:"https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=1200&q=80",
date:"1 अक्टूबर 2026"
},

{
id:4,
cat:"दुनिया",
title:"दुनिया की महत्वपूर्ण घटनाओं पर नज़र",
text:"दुनिया की प्रमुख घटनाओं की जानकारी NewsX_Tra पर पढ़ें।",
img:"https://images.unsplash.com/photo-1521295121783-8a321d551ad2?auto=format&fit=crop&w=1200&q=80",
date:"1 अक्टूबर 2026"
},

{
id:5,
cat:"नौकरी",
title:"सरकारी नौकरी और भर्ती से जुड़े अपडेट",
text:"भर्ती की योग्यता, फीस और अंतिम तारीख हमेशा आधिकारिक नोटिफिकेशन से जांचें।",
img:"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1200&q=80",
date:"1 अक्टूबर 2026"
}

];

const cats=["सभी","भारत","राजनीति","राजस्थान","दुनिया","नौकरी"];
let current="सभी";

function menu(){

document.getElementById("menu").innerHTML=
cats.map(c=>
`<button class="${c==current?'active':''}"
onclick="setCat('${c}')">${c}</button>`
).join("");

}

function setCat(c){

current=c;

document.getElementById("heading").textContent=
c=="सभी"?"ताज़ा खबरें":c+" की खबरें";

menu();
render();

}

function render(){

let q=document.getElementById("search").value.toLowerCase();

let list=news.filter(n=>
(current=="सभी"||n.cat==current)&&
(n.title+n.text+n.cat).toLowerCase().includes(q)
);

document.getElementById("newsGrid").innerHTML=list.map(n=>`

<article class="card">

<img src="${n.img}" alt="${n.title}">

<div class="cardbody">

<div class="cat">${n.cat}</div>

<h2>${n.title}</h2>

<div class="date">${n.date}</div>

<button class="read"
onclick="openArticle(${n.id})">
पूरी खबर पढ़ें →
</button>

</div>
</article>

`).join("");

}

function openArticle(id){

let n=news.find(x=>x.id==id);

document.getElementById("articleContent").innerHTML=`

<div class="cat">${n.cat}</div>

<h2>${n.title}</h2>

<div class="date">${n.date}</div>

<img src="${n.img}">

<p>${n.text}</p>

`;

document.getElementById("modal").style.display="block";

}

function closeArticle(){

document.getElementById("modal").style.display="none";

}

document.getElementById("search")
.addEventListener("input",render);

menu();
render();

</script>

</body>
</html>
